<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviator Dashboard</title>
<link rel="stylesheet" href="style.css">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">
    <h1>✈️ Aviator Dashboard</h1>

    <div class="card">
        <h2>Résultats</h2>
        <ul id="results"></ul>
    </div>

    <div class="card">
        <h2>Ajouter un résultat</h2>
        <input type="number" step="0.01" id="newResult" placeholder="Ex: 2.35">
        <button onclick="addResult()">Ajouter</button>
    </div>

    <div class="card">
        <h2>Moyenne</h2>
        <p><span id="average">0</span>x</p>
    </div>

    <div class="card">
        <h2>Graf Rezilta yo</h2>
        <canvas id="chart"></canvas>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
